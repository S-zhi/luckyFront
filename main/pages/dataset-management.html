<header class="page-header">
    <h1>数据集管理</h1>
    <p class="subtitle">上传与管理训练/推理数据集</p>
</header>
<div class="content-body">
    <div class="info-box">
        <i class="fa-solid fa-circle-info"></i>
        <span>管理本地、OSS 或 S3 存储的数据集。支持一键压缩并同步至云端网盘。</span>
    </div>
    <div class="card">
        <div class="card-header">
            <h2><i class="fa-solid fa-database"></i> 数据集列表</h2>
                
            <div class="actions" style="display: flex; gap: 12px; align-items: center;">
                <div class="search-bar">
                    <input type="text" placeholder="搜索数据集...">
                    <button class="btn btn-secondary"><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
                <button class="btn btn-primary"><i class="fa-solid fa-plus"></i> 上传数据集</button>
                <button class="btn btn-secondary"><i class="fa-solid fa-sync"></i> 刷新</button>
            </div>
        </div>
        <div class="card-body">
            <table class="data-table">
                <thead>
                    <tr>
                        <th data-sort="string">数据集名称</th>
                        <th data-sort="string">存储/格式</th>
                        <th data-sort="number">样本数量</th>
                        <th data-sort="string">大小</th>
                        <th data-sort="string">状态</th>
                        <th data-sort="date">上传时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <div class="name-cell">
                                <span>coco_val_2017.zip</span>
                                <span class="badge success sm">Latest</span>
                            </div>
                        </td>
                        <td>
                            <div class="tech-stack">
                                <span class="tag">Local</span>
                                <span class="tag">COCO</span>
                            </div>
                        </td>
                        <td>5,000</td>
                        <td>1.2 GB</td>
                        <td><span class="badge success">已标注</span></td>
                        <td>2023-10-20</td>
                        <td>
                            <div class="action-wrapper">
                                <button class="btn-icon action-toggle"><i class="fa-solid fa-ellipsis"></i></button>
                                <div class="action-menu">
                                    <button class="btn-icon cloud" title="压缩并上传网盘"><i class="fa-solid fa-file-zipper"></i></button>
                                    <button class="btn-icon delete" title="删除"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <div class="name-cell">
                                <span>Traffic_Signs_V1</span>
                                <span class="badge secondary sm">V1.0</span>
                            </div>
                        </td>
                        <td>
                            <div class="tech-stack">
                                <span class="tag">OSS</span>
                                <span class="tag">YOLO</span>
                            </div>
                        </td>
                        <td>1,200</td>
                        <td>450 MB</td>
                        <td><span class="badge processing">标注中</span></td>
                        <td>2023-10-22</td>
                        <td>
                            <div class="action-wrapper">
                                <button class="btn-icon action-toggle"><i class="fa-solid fa-ellipsis"></i></button>
                                <div class="action-menu">
                                    <button class="btn-icon cloud" title="压缩并上传网盘"><i class="fa-solid fa-file-zipper"></i></button>
                                    <button class="btn-icon delete" title="删除"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="pagination-container">
                <div class="pagination-info">
                    <span>共 <span id="total-items">0</span> 条记录</span>
                    <div>
                        每页显示:
                        <select class="page-size-select">
                            <option value="5">5</option>
                            <option value="10" selected>10</option>
                            <option value="20">20</option>
                        </select>
                    </div>
                </div>
                <div class="pagination-controls">
                    <!-- JS will populate buttons -->
                </div>
            </div>
        </div>
    </div>
</div>
