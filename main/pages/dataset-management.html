<header class="page-header">
    <h1>数据集管理</h1>
    <p class="subtitle">上传与管理训练/推理数据集</p>
</header>
<div class="content-body">
    <div class="info-box">
        <i class="fa-solid fa-circle-info"></i>
        <span>管理本地、OSS 或 S3 存储的数据集。支持一键压缩并同步至云端网盘。</span>
    </div>
    <div class="card">
        <div class="card-header model-card-header">
            <div class="model-title-block">
                <h2><i class="fa-solid fa-database"></i> 数据集列表</h2>
                <p class="model-subtitle">支持拖拽或点选上传数据集文件，并提交数据集元数据到后端。</p>
            </div>
                
                <div class="actions model-actions">
                    <div class="search-bar model-search-bar">
                        <input type="text" placeholder="搜索数据集..." data-dataset-search-input>
                        <button class="btn btn-secondary" data-dataset-search-btn><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>
                    <button class="btn btn-primary" data-dataset-upload-open><i class="fa-solid fa-plus"></i> 上传数据集</button>
                    <button class="btn btn-secondary" data-dataset-refresh-btn><i class="fa-solid fa-sync"></i> 刷新</button>
                </div>
            </div>
            <div class="card-body">
                <div class="dataset-message-slot" data-dataset-message></div>
                <table class="data-table" data-dataset-table>
                    <thead>
                        <tr>
                            <th data-sort="string">数据集名称</th>
                            <th data-sort="string">存储/格式</th>
                            <th data-sort="number">样本数量</th>
                            <th data-sort="string" data-dataset-sort="size">大小</th>
                            <th data-sort="string">状态</th>
                            <th data-sort="date">上传时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="7" class="table-state">数据集列表加载中...</td>
                        </tr>
                    </tbody>
                </table>
                <div class="pagination-container">
                    <div class="pagination-info">
                        <span>共 <span id="total-items" data-dataset-total-items>0</span> 条记录</span>
                        <div>
                            每页显示:
                            <select class="page-size-select" data-dataset-page-size>
                                <option value="5">5</option>
                                <option value="10" selected>10</option>
                                <option value="20">20</option>
                            </select>
                        </div>
                    </div>
                    <div class="pagination-controls" data-dataset-pagination>
                        <!-- JS will populate buttons -->
                    </div>
                </div>
            </div>
    </div>
</div>

<div class="modal-overlay" data-dataset-upload-modal hidden>
    <div class="modal-card model-import-card">
        <div class="modal-header">
            <h3>上传数据集</h3>
            <button class="btn-icon" type="button" data-dataset-upload-close title="关闭">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <p class="modal-subtitle">
            当前后端地址：
            <code data-dataset-api-base>http://localhost:8080/v1</code>
        </p>
        <div class="form-divider"></div>
        <form data-dataset-upload-form>
            <div
                class="upload-area small model-upload-dropzone"
                data-dataset-file-dropzone
                role="button"
                tabindex="0"
                aria-label="拖拽或点击选择数据集文件"
            >
                <input
                    type="file"
                    data-dataset-file-input
                    accept=".zip,.tar,.gz,.tgz,.7z,.rar,.json,.yaml,.yml,.txt"
                    hidden
                />
                <i class="fa-solid fa-folder-open"></i>
                <p>拖拽数据集文件到这里，或点击选择文件</p>
                <span class="hint" data-dataset-file-hint>
                    支持拖拽/点选，提交时会先调用文件上传接口，再写入数据集元数据。
                </span>
            </div>
            <div class="form-grid-2">
                <div class="form-group">
                    <label for="dataset-name">数据集名称 <span class="required-mark" aria-hidden="true">*</span></label>
                    <input id="dataset-name" name="name" class="form-control" type="text" required />
                </div>
                <div class="form-group">
                    <label for="dataset-version">版本 <span class="required-mark" aria-hidden="true">*</span></label>
                    <input id="dataset-version" name="version" class="form-control" type="text" placeholder="1.0" required />
                </div>
                <div class="form-group">
                    <label for="dataset-storage-server">存储服务 <span class="required-mark" aria-hidden="true">*</span></label>
                    <select
                        id="dataset-storage-server"
                        name="storage_server"
                        class="form-control"
                        data-storage-server-select
                        required
                    >
                        <option value="">加载中...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="dataset-format">数据集格式 <span class="required-mark" aria-hidden="true">*</span></label>
                    <input id="dataset-format" name="dataset_format" class="form-control" type="text" placeholder="yolo / coco / voc" required />
                </div>
                <div class="form-group">
                    <label for="dataset-task-type">任务类型 <span class="required-mark" aria-hidden="true">*</span></label>
                    <select id="dataset-task-type" name="task_type" class="form-control" required>
                        <option value="detect">detect</option>
                        <option value="segment">segment</option>
                        <option value="classify">classify</option>
                        <option value="pose">pose</option>
                        <option value="obb">obb</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="dataset-size-mb">数据集大小(MB) <span class="required-mark" aria-hidden="true">*</span></label>
                    <input id="dataset-size-mb" name="size_mb" class="form-control" type="number" min="0.01" step="0.01" readonly required />
                </div>
                <div class="form-group form-span-2">
                    <label for="dataset-path">数据集路径 <span class="required-mark" aria-hidden="true">*</span></label>
                    <input id="dataset-path" name="dataset_path" class="form-control" type="text" placeholder="/data/datasets/traffic_signs" required />
                </div>
                <div class="form-group form-span-2">
                    <label for="dataset-config-path">配置文件路径（可选）</label>
                    <input id="dataset-config-path" name="config_path" class="form-control" type="text" placeholder="data.yaml" />
                </div>
                <div class="form-group form-span-2">
                    <label for="dataset-description">描述（可选）</label>
                    <textarea id="dataset-description" name="description" class="form-control model-textarea" rows="3" placeholder="可填写样本来源、标注规则等"></textarea>
                </div>
            </div>
            <div class="model-import-feedback" data-dataset-upload-feedback hidden></div>
            <div class="form-actions modal-actions">
                <button class="btn btn-secondary" type="button" data-dataset-upload-close>取消</button>
                <button class="btn btn-primary" type="submit" data-dataset-upload-submit>
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    提交上传
                </button>
            </div>
        </form>
    </div>
</div>
