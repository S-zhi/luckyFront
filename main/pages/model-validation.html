<header class="page-header">
    <h1>模型训练日志</h1>
    <p class="subtitle">保存训练过程摘要、Markdown 记录与 Comet 日志信息，统一管理训练历史</p>
</header>

<div class="content-body inference-stack-layout">
    <div class="info-box">
        <i class="fa-solid fa-circle-info"></i>
        <span>当前模块已接管原“训练结果管理”能力，支持录入训练日志名称、核心指标、训练 Markdown 和 Comet 日志 Markdown。</span>
    </div>

    <div class="card">
        <div class="card-header">
            <h2><i class="fa-solid fa-book-open"></i> 日志录入</h2>
            <div class="actions">
                <button class="btn btn-secondary" type="button" data-training-log-reset-btn>
                    <i class="fa-solid fa-rotate-left"></i>
                    清空表单
                </button>
            </div>
        </div>
        <div class="card-body">
            <form data-training-log-form>
                <input type="hidden" data-training-log-id />
                <div class="form-grid-2">
                    <div class="form-group">
                        <label for="training-log-name">日志名称 <span class="required-mark" aria-hidden="true">*</span></label>
                        <input id="training-log-name" name="training_name" class="form-control" type="text" placeholder="例如：YOLOv8 夜间巡检训练记录" required />
                    </div>
                    <div class="form-group">
                        <label for="training-log-status">训练状态 <span class="required-mark" aria-hidden="true">*</span></label>
                        <select id="training-log-status" name="training_status" class="form-control" required>
                            <option value="0">待开始</option>
                            <option value="1">训练中</option>
                            <option value="2" selected>成功</option>
                            <option value="3">失败</option>
                            <option value="4">已中断</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="training-log-model-id">模型 ID <span class="required-mark" aria-hidden="true">*</span></label>
                        <input id="training-log-model-id" name="model_id" class="form-control" type="number" min="1" step="1" placeholder="例如：12" required />
                    </div>
                    <div class="form-group">
                        <label for="training-log-dataset-id">数据集 ID <span class="required-mark" aria-hidden="true">*</span></label>
                        <input id="training-log-dataset-id" name="dataset_id" class="form-control" type="number" min="1" step="1" placeholder="例如：8" required />
                    </div>
                    <div class="form-group">
                        <label for="training-log-dataset-version">数据集版本</label>
                        <input id="training-log-dataset-version" name="dataset_version" class="form-control" type="number" min="0" step="0.001" value="1.000" />
                    </div>
                    <div class="form-group">
                        <label for="training-log-weight-path">权重路径</label>
                        <input id="training-log-weight-path" name="weight_path" class="form-control" type="text" placeholder="/tmp/runs/train/exp/best.pt" />
                    </div>
                    <div class="form-group form-span-2">
                        <label for="training-log-comet-url">Comet 日志链接</label>
                        <input id="training-log-comet-url" name="comet_log_url" class="form-control" type="url" placeholder="https://www.comet.com/..." />
                    </div>
                    <div class="form-group form-span-2">
                        <label for="training-log-metrics">核心指标 JSON</label>
                        <textarea id="training-log-metrics" name="metric_detail" class="form-control model-textarea training-log-textarea" placeholder='例如：{"mAP50":0.921,"recall":0.887,"loss":0.136}'></textarea>
                    </div>
                    <div class="form-group form-span-2">
                        <label for="training-log-markdown">训练 Markdown 记录</label>
                        <textarea id="training-log-markdown" name="training_log_markdown" class="form-control model-textarea training-log-textarea" placeholder="# 训练摘要&#10;&#10;- 使用 YOLOv8n&#10;- 训练 300 epochs&#10;- 重点观察夜间样本误检"></textarea>
                    </div>
                    <div class="form-group form-span-2">
                        <label for="training-log-comet-markdown">Comet 日志 Markdown</label>
                        <textarea id="training-log-comet-markdown" name="comet_log_markdown" class="form-control model-textarea training-log-textarea" placeholder="## Comet 备注&#10;&#10;- 实验名称：night-inspection-v3&#10;- 关键对比：baseline / aug-v2"></textarea>
                    </div>
                </div>
                <div class="model-import-feedback" data-training-log-form-feedback hidden></div>
                <div class="form-actions modal-actions">
                    <button class="btn btn-secondary" type="button" data-training-log-reset-btn>重置</button>
                    <button class="btn btn-primary" type="submit" data-training-log-submit-btn>
                        <i class="fa-solid fa-floppy-disk"></i>
                        保存训练日志
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="card list-card">
        <div class="card-header model-card-header">
            <div class="model-title-block">
                <h2>训练日志列表</h2>
                <p class="model-subtitle">数据来源：<code data-training-api-base>http://localhost:8080/v1</code>/training-results</p>
            </div>
            <div class="actions model-actions">
                <div class="search-bar model-search-bar">
                    <input type="text" placeholder="搜索日志名称、权重路径或 Comet..." data-training-search-input>
                    <button class="btn btn-secondary" type="button" data-training-search-btn><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
                <input
                    class="model-filter-input"
                    type="number"
                    min="1"
                    step="1"
                    placeholder="模型ID"
                    data-training-filter-model-id
                    aria-label="按模型ID筛选"
                />
                <input
                    class="model-filter-input"
                    type="number"
                    min="1"
                    step="1"
                    placeholder="数据集ID"
                    data-training-filter-dataset-id
                    aria-label="按数据集ID筛选"
                />
                <select class="model-filter-select" data-training-filter-status aria-label="按训练状态筛选">
                    <option value="">全部状态</option>
                    <option value="0">待开始</option>
                    <option value="1">训练中</option>
                    <option value="2">成功</option>
                    <option value="3">失败</option>
                    <option value="4">已中断</option>
                </select>
                <button class="btn btn-secondary" type="button" data-training-filter-reset>
                    <i class="fa-solid fa-filter"></i>
                    清空筛选
                </button>
                <button class="btn btn-secondary" type="button" data-training-refresh-btn>
                    <i class="fa-solid fa-sync"></i>
                    刷新
                </button>
            </div>
        </div>
        <div class="card-body">
            <div class="model-message-slot" data-training-message></div>
            <table class="data-table" data-training-table>
                <thead>
                    <tr>
                        <th>日志名称</th>
                        <th>模型/数据集</th>
                        <th>核心指标</th>
                        <th>状态</th>
                        <th>Markdown / Comet</th>
                        <th>更新时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="7" class="table-state">训练日志加载中...</td>
                    </tr>
                </tbody>
            </table>
            <div class="pagination-container">
                <div class="pagination-info">
                    <span>共 <span data-training-total-items>0</span> 条记录</span>
                    <div>
                        每页显示:
                        <select class="page-size-select" data-training-page-size>
                            <option value="5">5</option>
                            <option value="10" selected>10</option>
                            <option value="20">20</option>
                        </select>
                    </div>
                </div>
                <div class="pagination-controls" data-training-pagination></div>
            </div>
        </div>
    </div>
</div>
