<header class="page-header">
    <h1>本地模型管理</h1>
    <p class="subtitle">管理、导入并维护本地 AI 模型文件</p>
</header>

<div class="content-body">
    <div class="info-box">
        <i class="fa-solid fa-circle-info"></i>
        <span>支持检测、分割、分类等多种任务模型，对接 Lucky Project v1 API，并兼容本地存储与百度网盘存储标记。</span>
    </div>

    <div class="card list-card">
        <div class="card-header model-card-header">
            <div class="model-title-block">
                <h2>已导入模型列表</h2>
                <p class="model-subtitle">支持关键字检索、任务类型筛选、分页与按体积排序，导入成功后会自动刷新列表。</p>
            </div>
            <div class="actions model-actions">
                <div class="search-bar model-search-bar">
                    <input type="text" placeholder="搜索模型..." data-model-search-input>
                    <button class="btn btn-secondary" data-model-search-btn>
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
                <select class="model-filter-select" data-model-filter-task-type aria-label="按任务类型筛选">
                    <option value="">全部类型</option>
                    <option value="detect">detect</option>
                    <option value="segment">segment</option>
                    <option value="classify">classify</option>
                    <option value="pose">pose</option>
                    <option value="obb">obb</option>
                </select>
                <button class="btn btn-secondary" data-model-filter-reset>
                    <i class="fa-solid fa-filter"></i>
                    清空筛选
                </button>
                <button class="btn btn-primary" data-model-import-open>
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    导入模型
                </button>
                <button class="btn btn-secondary" data-model-refresh-btn>
                    <i class="fa-solid fa-sync"></i>
                    刷新
                </button>
            </div>
        </div>
        <div class="card-body">
            <div class="model-message-slot" data-model-message></div>
            <table class="data-table" data-model-table>
                <thead>
                    <tr>
                        <th>模型名称</th>
                        <th>算法 / 框架</th>
                        <th>任务类型</th>
                        <th data-sort="string" data-model-sort="size">大小</th>
                        <th>导入时间</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="7" class="table-state">模型列表加载中...</td>
                    </tr>
                </tbody>
            </table>
            <div class="pagination-container">
                <div class="pagination-info">
                    <span>共 <span id="total-items" data-model-total-items>0</span> 条记录</span>
                    <div>
                        每页显示:
                        <select class="page-size-select" data-model-page-size>
                            <option value="5">5</option>
                            <option value="10" selected>10</option>
                            <option value="20">20</option>
                        </select>
                    </div>
                </div>
                <div class="pagination-controls" data-model-pagination>
                    <!-- JS will populate buttons -->
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" data-model-import-modal hidden>
    <div class="modal-card model-import-card">
        <div class="modal-header">
            <h3>导入模型</h3>
            <button class="btn-icon" type="button" data-model-import-close title="关闭">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="form-divider"></div>
        <form data-model-import-form>
            <div
                class="upload-area small model-upload-dropzone"
                data-model-file-dropzone
                role="button"
                tabindex="0"
                aria-label="拖拽或点击选择模型文件"
            >
                <input
                    type="file"
                    data-model-file-input
                    accept=".pt,.pth,.onnx,.engine,.trt,.bin,.ckpt"
                    hidden
                />
                <i class="fa-solid fa-file-arrow-up"></i>
                <p>拖拽模型文件到这里，或点击选择文件</p>
                <span class="hint" data-model-file-hint></span>
            </div>
            <div class="form-grid-2">
                <div class="form-group">
                    <label for="model-name">模型名称 <span class="required-mark" aria-hidden="true">*</span></label>
                    <input id="model-name" name="name" class="form-control" type="text" required />
                </div>
                <div class="form-group">
                    <label for="model-version">版本 <span class="required-mark" aria-hidden="true">*</span></label>
                    <input id="model-version" name="version" class="form-control" type="text" placeholder="v1.0" required />
                </div>
                <div class="form-group">
                    <label for="model-storage-server">存储服务 <span class="required-mark" aria-hidden="true">*</span></label>
                    <select
                        id="model-storage-server"
                        name="storage_server"
                        class="form-control"
                        data-storage-server-select
                        required
                    >
                        <option value="">加载中...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="model-impl-type">算法 ID <span class="required-mark" aria-hidden="true">*</span></label>
                    <input id="model-impl-type" name="impl_type" class="form-control" type="text" placeholder="例如 yolov8" required />
                </div>
                <div class="form-group">
                    <label for="model-task-type">任务类型 <span class="required-mark" aria-hidden="true">*</span></label>
                    <select id="model-task-type" name="task_type" class="form-control" required>
                        <option value="detect">detect</option>
                        <option value="segment">segment</option>
                        <option value="classify">classify</option>
                        <option value="pose">pose</option>
                        <option value="obb">obb</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="model-size-mb">模型大小 (MB) <span class="required-mark" aria-hidden="true">*</span></label>
                    <input id="model-size-mb" name="size_mb" class="form-control" type="number" min="0.01" step="0.01" required />
                </div>
                <div class="form-group form-span-2">
                    <label for="model-path">模型路径（上传后自动生成）</label>
                    <input
                        id="model-path"
                        name="model_path"
                        class="form-control"
                        type="text"
                        placeholder="上传完成后自动回填保存路径"
                        readonly
                    />
                </div>
                <div class="form-group form-span-2">
                    <label for="model-description">描述（可选）</label>
                    <textarea id="model-description" name="description" class="form-control model-textarea" rows="3" placeholder="可填写模型来源、用途、训练备注等信息"></textarea>
                </div>
            </div>
            <div class="model-import-feedback" data-model-import-feedback hidden></div>
            <div class="form-actions modal-actions">
                <button class="btn btn-secondary" type="button" data-model-import-close>取消</button>
                <button class="btn btn-primary" type="submit" data-model-import-submit>
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    提交导入
                </button>
            </div>
        </form>
    </div>
</div>
