<header class="page-header">
    <h1>训练结果管理</h1>
    <p class="subtitle">查看模型训练历史与性能指标</p>
</header>

<div class="content-body">
    <div class="info-box">
        <i class="fa-solid fa-circle-info"></i>
        <span>已对接 Lucky Project v1 训练结果接口。支持按模型ID、数据集ID和训练状态筛选，支持复制权重路径与打开 Comet 日志。</span>
    </div>

    <div class="card list-card">
        <div class="card-header model-card-header">
            <div class="model-title-block">
                <h2>训练任务记录</h2>
                <p class="model-subtitle">数据来源：<code data-training-api-base>http://localhost:8080/v1</code>/training-results</p>
            </div>
            <div class="actions model-actions">
                <div class="search-bar model-search-bar">
                    <input type="text" placeholder="搜索任务..." data-training-search-input>
                    <button class="btn btn-secondary" data-training-search-btn><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
                <input
                    class="model-filter-input"
                    type="number"
                    min="1"
                    step="1"
                    placeholder="模型ID"
                    data-training-filter-model-id
                    aria-label="按模型ID筛选"
                />
                <input
                    class="model-filter-input"
                    type="number"
                    min="1"
                    step="1"
                    placeholder="数据集ID"
                    data-training-filter-dataset-id
                    aria-label="按数据集ID筛选"
                />
                <select class="model-filter-select" data-training-filter-status aria-label="按训练状态筛选">
                    <option value="">全部状态</option>
                    <option value="0">待开始</option>
                    <option value="1">训练中</option>
                    <option value="2">成功</option>
                    <option value="3">失败</option>
                    <option value="4">已中断</option>
                </select>
                <button class="btn btn-secondary" data-training-filter-reset>
                    <i class="fa-solid fa-filter"></i>
                    清空筛选
                </button>
                <button class="btn btn-secondary" data-training-refresh-btn>
                    <i class="fa-solid fa-sync"></i>
                    刷新
                </button>
            </div>
        </div>
        <div class="card-body">
            <div class="model-message-slot" data-training-message></div>
            <table class="data-table" data-training-table>
                <thead>
                    <tr>
                        <th>任务ID</th>
                        <th>模型ID</th>
                        <th>数据集/版本</th>
                        <th>核心指标</th>
                        <th>状态</th>
                        <th>权重路径</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="7" class="table-state">训练结果加载中...</td>
                    </tr>
                </tbody>
            </table>
            <div class="pagination-container">
                <div class="pagination-info">
                    <span>共 <span data-training-total-items>0</span> 条记录</span>
                    <div>
                        每页显示:
                        <select class="page-size-select" data-training-page-size>
                            <option value="5">5</option>
                            <option value="10" selected>10</option>
                            <option value="20">20</option>
                        </select>
                    </div>
                </div>
                <div class="pagination-controls" data-training-pagination>
                    <!-- JS will populate buttons -->
                </div>
            </div>
        </div>
    </div>
</div>
