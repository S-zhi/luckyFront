<header class="page-header">
    <h1>模型训练</h1>
    <p class="subtitle">配置参数并启动模型训练任务</p>
</header>

<div class="content-body">
    <div class="grid-layout">
        <!-- 左列：训练配置 -->
        <div class="grid-col left-col">
            <div class="card">
                <div class="card-header">
                    <h2><i class="fa-solid fa-gears"></i> 训练参数配置</h2>
                </div>
                <div class="card-body">
                    <form class="training-form">
                        <div class="form-group">
                            <label>任务名称</label>
                            <input type="text" class="form-control" placeholder="例如: yolo_v8_finetune_v1">
                        </div>
                        
                        <div class="form-group">
                            <label for="training-base-model">基础模型权重 (Base Model)</label>
                            <input
                                id="training-base-model"
                                type="text"
                                class="form-control"
                                list="training-base-model-list"
                                placeholder="输入模型名称或 ID，例如 yolo26n / 206"
                                autocomplete="off"
                                data-training-base-model-input
                            />
                            <datalist id="training-base-model-list" data-training-base-model-list></datalist>
                            <input type="hidden" name="base_model_id" data-training-base-model-id />
                            <p class="form-hint" data-training-base-model-hint>可输入模型名称或 ID 检索；留空表示从零训练。</p>
                        </div>

                        <div class="form-group">
                            <label>训练数据集</label>
                            <select class="form-control">
                                <option>coco_val_2017 (5000 images)</option>
                                <option>custom_traffic_signs (1200 images)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>超参数设置</label>
                            <div class="param-grid">
                                <div>
                                    <label style="font-size: 12px;">Epochs</label>
                                    <input type="number" class="form-control" value="100">
                                </div>
                                <div>
                                    <label style="font-size: 12px;">Batch Size</label>
                                    <input type="number" class="form-control" value="16">
                                </div>
                                <div>
                                    <label style="font-size: 12px;">Learning Rate</label>
                                    <input type="text" class="form-control" value="0.001">
                                </div>
                                <div>
                                    <label style="font-size: 12px;">Device</label>
                                    <select class="form-control">
                                        <option>GPU 0 (RTX 4090)</option>
                                        <option>CPU</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="form-actions" style="margin-top: 24px;">
                            <button type="button" class="btn btn-primary full-width">
                                <i class="fa-solid fa-play"></i> 开始训练
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- 右列：实时监控 -->
        <div class="grid-col right-col">
            <div class="card result-card">
                <div class="card-header">
                    <h2>训练状态监控</h2>
                    <span class="badge processing">准备就绪</span>
                </div>
                <div class="card-body">
                    <div class="result-placeholder">
                        <i class="fa-solid fa-chart-area" style="font-size: 48px; color: var(--text-light); margin-bottom: 16px;"></i>
                        <p>暂无正在进行的训练任务</p>
                        <p style="font-size: 12px; margin-top: 8px;">点击左侧“开始训练”启动任务</p>
                    </div>

                    <!-- 模拟运行中状态 (Hidden) -->
                    <div class="training-status" style="display: none;">
                        <div class="form-group">
                            <label>当前进度 (Epoch 12/100)</label>
                            <div style="background: rgba(0,0,0,0.1); border-radius: 10px; height: 10px; overflow: hidden;">
                                <div style="width: 12%; background: var(--primary-color); height: 100%;"></div>
                            </div>
                        </div>
                        
                        <div class="code-block" style="height: 300px; overflow-y: auto;">
[14:20:01] Starting training on GPU 0...
[14:20:05] Epoch 1/100: Loss=2.45, Accuracy=0.15
[14:21:30] Epoch 2/100: Loss=1.98, Accuracy=0.28
[14:23:00] Epoch 3/100: Loss=1.56, Accuracy=0.42
...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
